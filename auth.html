<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moufeed World – Sign in</title>
<style>
  :root { --bg:#14201c; --card:#1d2d27; --ink:#eef3ef; --mute:#9db2a8; --accent:#e8b84a; --err:#ff8a7a; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px;
    background:var(--bg); color:var(--ink); font-family:Georgia, "Times New Roman", serif; }
  main { width:100%; max-width:380px; background:var(--card); padding:28px 24px; border-radius:14px; }
  h1 { margin:0 0 4px; font-size:1.7rem; font-weight:700; }
  p.sub { margin:0 0 22px; color:var(--mute); font-family:system-ui, sans-serif; font-size:.95rem; }
  label { display:block; margin:14px 0 6px; font-family:system-ui, sans-serif; font-size:.9rem; }
  input { width:100%; padding:12px; border-radius:8px; border:1px solid #3a5248;
    background:#14201c; color:var(--ink); font-size:1rem; }
  input:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button { width:100%; margin-top:20px; padding:13px; border:0; border-radius:8px;
    background:var(--accent); color:#1a1a1a; font-size:1rem; font-weight:700; cursor:pointer; }
  button.link { background:none; color:var(--accent); margin-top:10px; font-weight:400; text-decoration:underline; }
  #msg { min-height:1.3em; margin-top:14px; font-family:system-ui, sans-serif; font-size:.9rem; color:var(--err); }
  #msg.ok { color:#8fd9a8; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <section id="authView">
    <h1 id="title">Log in</h1>
    <p class="sub" id="sub">Welcome back to Moufeed World.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="submit">Log in</button>
    <button class="link" id="toggle">Create an account</button>
    <button class="link" id="reset">Forgot password?</button>
  </section>

  <section id="userView" class="hidden">
    <h1>You're in</h1>
    <p class="sub" id="who"></p>
    <button id="logout">Log out</button>
  </section>

  <div id="msg" role="alert"></div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged, sendPasswordResetEmail }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYUaHyYAT4c4cUJrITAUjQOV5oqLu69P0",
  authDomain: "moufeed-world.firebaseapp.com",
  projectId: "moufeed-world",
  appId: "1:258552792150:web:63e42d87b24cfc9ef367f7"
};

const auth = getAuth(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);
let signUp = false;

const errors = {
  "auth/invalid-credential": "Wrong email or password.",
  "auth/email-already-in-use": "That email already has an account. Log in instead.",
  "auth/weak-password": "Use a password with at least 6 characters.",
  "auth/invalid-email": "Enter a valid email address.",
  "auth/missing-password": "Enter your password.",
  "auth/too-many-requests": "Too many attempts. Try again in a few minutes.",
  "auth/network-request-failed": "No connection. Check your internet."
};
const show = (text, ok = false) => { $("msg").textContent = text; $("msg").className = ok ? "ok" : ""; };

$("toggle").onclick = () => {
  signUp = !signUp;
  $("title").textContent = signUp ? "Create account" : "Log in";
  $("sub").textContent = signUp ? "Sign up with your email." : "Welcome back to Moufeed World.";
  $("submit").textContent = signUp ? "Sign up" : "Log in";
  $("toggle").textContent = signUp ? "I already have an account" : "Create an account";
  $("password").autocomplete = signUp ? "new-password" : "current-password";
  show("");
};

$("submit").onclick = async () => {
  const email = $("email").value.trim(), pass = $("password").value;
  try {
    show("");
    if (signUp) await createUserWithEmailAndPassword(auth, email, pass);
    else await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) { show(errors[e.code] || e.message); }
};

$("reset").onclick = async () => {
  const email = $("email").value.trim();
  if (!email) return show("Enter your email first, then tap Forgot password.");
  try { await sendPasswordResetEmail(auth, email); show("Reset link sent. Check your inbox.", true); }
  catch (e) { show(errors[e.code] || e.message); }
};

$("logout").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  $("authView").classList.toggle("hidden", !!user);
  $("userView").classList.toggle("hidden", !user);
  if (user) { $("who").textContent = "Signed in as " + user.email; show(""); }
});
</script>
</body>
  </html>
