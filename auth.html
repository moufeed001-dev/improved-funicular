<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOUFEED WORLD – Authentication</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #ffd21f;
    --gold-light: #ffe066;
    --ink: #f4f1ea;
    --mute: #8d8a84;
    --line: rgba(255, 255, 255, 0.12);
    --err: #ff8a7a;
    --dark: #050505;
    --card: #1d2d27;
  }
  
  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    color: var(--ink);
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    background: var(--dark);
    overflow-x: hidden;
  }
  
  /* ANIMATED BACKGROUND */
  .bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: var(--dark);
  }
  
  .bg::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(600px at 20% 30%, rgba(255, 210, 31, 0.12), transparent 70%),
      radial-gradient(500px at 85% 75%, rgba(255, 210, 31, 0.08), transparent 70%);
    animation: gradientShift 8s ease-in-out infinite;
  }
  
  @keyframes gradientShift {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(20px, -20px); }
  }
  
  main {
    width: 100%;
    max-width: 420px;
    animation: cardSlideUp 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  
  @keyframes cardSlideUp {
    from {
      opacity: 0;
      transform: translateY(40px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  
  .card {
    padding: 1px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0.06) 40%, rgba(255, 210, 31, 0.25));
    clip-path: polygon(44px 0, 100% 0, 100% 100%, 0 100%, 0 44px);
    border-radius: 0;
  }
  
  .inner {
    padding: 34px 26px 24px;
    background: rgba(18, 18, 18, 0.78);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    clip-path: polygon(43px 0, 100% 0, 100% 100%, 0 100%, 0 43px);
  }
  
  h1 {
    margin: 0 0 4px;
    font-size: 1.7rem;
    font-weight: 700;
    animation: fadeInDown 0.6s ease-out 0.1s both;
  }
  
  @keyframes fadeInDown {
    from {
      opacity: 0;
      transform: translateY(-20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  
  p.sub {
    margin: 0 0 22px;
    color: var(--mute);
    font-family: system-ui, sans-serif;
    font-size: 0.95rem;
    animation: fadeInDown 0.6s ease-out 0.2s both;
  }
  
  label {
    display: block;
    margin: 14px 0 6px;
    font-family: system-ui, sans-serif;
    font-size: 0.9rem;
    animation: fadeInDown 0.6s ease-out both;
  }
  
  label:nth-of-type(1) { animation-delay: 0.3s; }
  label:nth-of-type(2) { animation-delay: 0.4s; }
  label:nth-of-type(3) { animation-delay: 0.5s; }
  
  .field {
    position: relative;
    margin-bottom: 4px;
  }
  
  .field svg.i {
    position: absolute;
    left: 12px;
    top: 50%;
    width: 16px;
    height: 16px;
    transform: translateY(-50%);
    stroke: var(--mute);
    fill: none;
    stroke-width: 1.8;
    transition: stroke 0.3s;
  }
  
  input[type="email"],
  input[type="password"],
  input[type="text"] {
    width: 100%;
    padding: 13px 40px 13px 38px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.04);
    color: var(--ink);
    font: inherit;
    font-size: 0.9rem;
    transition: all 0.3s ease;
    animation: fadeInUp 0.6s ease-out both;
  }
  
  input:nth-of-type(1) { animation-delay: 0.3s; }
  input:nth-of-type(2) { animation-delay: 0.4s; }
  input:nth-of-type(3) { animation-delay: 0.5s; }
  input:nth-of-type(4) { animation-delay: 0.6s; }
  
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  
  input::placeholder {
    color: #5f5d59;
  }
  
  input:focus {
    outline: none;
    border-color: var(--gold);
    background: rgba(255, 255, 255, 0.06);
    box-shadow: 0 0 0 3px rgba(255, 210, 31, 0.15);
    transform: translateY(-2px);
  }
  
  .eye {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: 0;
    padding: 6px;
    cursor: pointer;
    color: var(--mute);
    transition: all 0.3s;
  }
  
  .eye:hover {
    color: var(--gold);
  }
  
  .eye svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    display: block;
  }
  
  button {
    border: none;
    font: inherit;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  
  button:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }
  
  .primary {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    border-radius: 8px;
    background: var(--gold);
    color: #1a1a1a;
    font-size: 1rem;
    font-weight: 700;
    animation: fadeInUp 0.6s ease-out 0.7s both;
    position: relative;
    overflow: hidden;
  }
  
  .primary::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: width 0.6s, height 0.6s;
  }
  
  .primary:active::before {
    width: 300px;
    height: 300px;
  }
  
  .primary:hover:not(:disabled) {
    background: var(--gold-light);
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(255, 210, 31, 0.25);
  }
  
  .primary:disabled {
    opacity: 0.6;
    cursor: wait;
  }
  
  .btn-spinner {
    display: none;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(26, 26, 26, 0.3);
    border-top-color: #1a1a1a;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
  }
  
  .primary:disabled .btn-spinner {
    display: inline-block;
  }
  
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  
  .link {
    background: none;
    color: var(--gold);
    margin-top: 10px;
    font-weight: 400;
    text-decoration: underline;
    animation: fadeInUp 0.6s ease-out both;
  }
  
  .link:nth-of-type(1) { animation-delay: 0.75s; }
  .link:nth-of-type(2) { animation-delay: 0.8s; }
  
  .link:hover {
    color: var(--gold-light);
  }
  
  #msg {
    min-height: 1.3em;
    margin-top: 14px;
    font-family: system-ui, sans-serif;
    font-size: 0.9rem;
    color: var(--err);
    animation: fadeInDown 0.4s ease-out;
  }
  
  #msg.ok {
    color: #8fd9a8;
  }
  
  @keyframes messageSlideIn {
    from {
      opacity: 0;
      transform: translateY(-10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  
  .hidden {
    display: none;
  }
  
  .signup-only {
    display: none;
  }
  
  .is-signup .signup-only {
    display: block;
  }
  
  /* TOGGLE ANIMATION */
  .toggle-transition {
    animation: fadeOutInTransition 0.3s ease-out;
  }
  
  @keyframes fadeOutInTransition {
    0% { opacity: 1; }
    50% { opacity: 0.5; }
    100% { opacity: 1; }
  }
  
  /* SUCCESS STATE */
  .success-state {
    text-align: center;
    animation: successPulse 0.6s ease-out;
  }
  
  @keyframes successPulse {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  
  .success-icon {
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #8fd9a8, #4ade80);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-size: 2rem;
    animation: successBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  
  @keyframes successBounce {
    0% { transform: scale(0) rotate(-45deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
</style>
</head>
<body>

<div class="bg"></div>

<main>
  <div class="card">
    <div class="inner" id="box">
      <h1 id="title">Log in</h1>
      <p class="sub" id="sub">Welcome back to Moufeed World.</p>
      
      <div class="signup-only">
        <label for="name">Full Name</label>
        <div class="field">
          <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <input id="name" type="text" placeholder="Your Full Name" autocomplete="name">
        </div>
      </div>

      <label for="email">Email</label>
      <div class="field">
        <svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <input id="email" type="email" placeholder="your@email.com" autocomplete="email">
      </div>

      <label for="password">Password</label>
      <div class="field">
        <svg class="i" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
        <button class="eye" type="button" data-for="password" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>

      <div class="signup-only">
        <label for="confirm">Confirm Password</label>
        <div class="field">
          <svg class="i" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="confirm" type="password" placeholder="••••••••" autocomplete="new-password">
          <button class="eye" type="button" data-for="confirm" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>

      <button class="primary" id="submit"><span class="btn-spinner"></span>Log in</button>
      <button class="link" id="toggle">Create an account</button>
      <button class="link" id="reset">Forgot password?</button>
      <div id="msg" role="alert"></div>
    </div>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged, sendPasswordResetEmail }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYUaHyYAT4c4cUJrITAUjQOV5oqLu69P0",
  authDomain: "moufeed-world.firebaseapp.com",
  projectId: "moufeed-world",
  appId: "1:258552792150:web:63e42d87b24cfc9ef367f7"
};

const auth = getAuth(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);
let signUp = false;

const errors = {
  "auth/invalid-credential": "Wrong email or password.",
  "auth/email-already-in-use": "That email already has an account. Log in instead.",
  "auth/weak-password": "Use a password with at least 6 characters.",
  "auth/invalid-email": "Enter a valid email address.",
  "auth/missing-password": "Enter your password.",
  "auth/too-many-requests": "Too many attempts. Try again in a few minutes.",
  "auth/network-request-failed": "No connection. Check your internet."
};

const show = (text, ok = false) => {
  const msg = $("msg");
  msg.textContent = text;
  msg.className = ok ? "ok" : "";
  msg.style.animation = "none";
  setTimeout(() => { msg.style.animation = "fadeInDown 0.4s ease-out"; }, 10);
};

// Show/Hide Password
document.querySelectorAll(".eye").forEach(b => {
  b.onclick = e => {
    e.preventDefault();
    const i = $(b.dataset.for);
    i.type = i.type === "password" ? "text" : "password";
    b.style.transform = i.type === "text" ? "translateY(-50%) rotate(180deg)" : "translateY(-50%) rotate(0deg)";
  };
});

$("toggle").onclick = () => {
  signUp = !signUp;
  const box = $("box");
  box.classList.toggle("toggle-transition");
  
  setTimeout(() => {
    box.classList.toggle("is-signup", signUp);
    $("title").textContent = signUp ? "Create account" : "Log in";
    $("sub").textContent = signUp ? "Sign up with your email." : "Welcome back to Moufeed World.";
    $("submit").innerHTML = signUp ? '<span class="btn-spinner"></span>Sign up' : '<span class="btn-spinner"></span>Log in';
    $("toggle").textContent = signUp ? "I already have an account" : "Create an account";
    $("password").autocomplete = signUp ? "new-password" : "current-password";
    show("");
  }, 150);
};

$("submit").onclick = async () => {
  const email = $("email").value.trim(), pass = $("password").value;
  try {
    show("");
    $("submit").disabled = true;
    if (signUp) {
      if (!$("name").value.trim()) return (show("Enter your full name."), $("submit").disabled = false);
      if (pass !== $("confirm").value) return (show("Passwords don't match."), $("submit").disabled = false);
      await createUserWithEmailAndPassword(auth, email, pass);
    } else await signInWithEmailAndPassword(auth, email, pass);
    
    // Success animation
    show("✓ Success! Redirecting...", true);
    setTimeout(() => location.href = "index.html", 1200);
  } catch (e) {
    $("submit").disabled = false;
    show(errors[e.code] || e.message);
  }
};

$("reset").onclick = async () => {
  const email = $("email").value.trim();
  if (!email) return show("Enter your email first, then tap Forgot password.");
  try { await sendPasswordResetEmail(auth, email); show("✓ Reset link sent. Check your inbox.", true); }
  catch (e) { show(errors[e.code] || e.message); }
};

onAuthStateChanged(auth, user => { if (user) location.href = "index.html"; });
</script>
</body>
  </html>
